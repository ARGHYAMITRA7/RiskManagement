services:
  - type: web
    name: ai-student-learning-platform
    env: node
    buildCommand: npm install && npm run build
    startCommand: bash render-start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-student-db
          property: connectionString
      - key: DEMO_PASSWORD
        value: ChangeMe@12345
      - key: COOKIE_SECURE
        value: true
      - key: EMAIL_ENABLED
        value: false
      - key: NODE_ENV
        value: production

databases:
  - name: ai-student-db
    databaseName: app_db
    user: postgres
